name: Deploy to GitHub Pages

on:
  # Pushes and PRs BUILD only - they verify the site still compiles.
  # They no longer publish. See the deploy job below.
  push:
    branches: [ main ]
    paths-ignore:
      - 'growth/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'growth/**'

  # Publishing to snackua.com happens ONLY from here:
  # Actions tab -> "Deploy to GitHub Pages" -> "Run workflow".
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install production dependencies (ignore peer conflicts)
        env:
          NODE_ENV: production
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: npm install --production --legacy-peer-deps --no-audit --no-fund

      - name: Ensure babel preset for Expo is available
        run: npm install babel-preset-expo --no-audit --no-fund
        
      - name: Build web version
        run: npm run build:web
        
      - name: Add .nojekyll file
        run: touch dist/.nojekyll

      # GitHub Pages ignores the Netlify-style _redirects file, so serve the
      # SPA shell on unknown paths to keep deep links like /products working.
      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    # Publishing is MANUAL and deliberate. Every push to main still runs the
    # build job above as a validation check, but the live site only changes
    # when someone runs this workflow by hand from the Actions tab.
    # Also guarded to main so a dispatch from another branch cannot publish.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
